name: Starter guardrail tests

on:
  push:
    branches: [main, "fix/**", "feature/**", "release/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python run_tests.py --demo
      - run: python -m pip install -r requirements-core.txt
      - run: python run_tests.py --full
      - run: PYTHONPATH=. python examples/guard_demo.py
