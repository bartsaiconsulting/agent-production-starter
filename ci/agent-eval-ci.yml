name: Agent Production Guardrails & Eval Gate

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  guardrail-eval:
    name: Deterministic Guardrails & Trajectory Eval
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Pinned Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt

      - name: Run Deterministic Safety & Trajectory Test Suite
        env:
          DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
        run: |
          python run_tests.py --full

      - name: Run End-to-End Guardrail Demo Verification
        run: |
          PYTHONPATH=. python examples/guard_demo.py
